<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Student dashboard | DocFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Sora:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/requests.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <script src="/js/theme.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="topbar"></header>
  <main id="main" class="container page">
    <section class="card welcome-card" aria-labelledby="welcome">
      <div>
        <h1 id="welcome">Loading...</h1>
        <p class="muted">Ready to continue?</p>
      </div>
      <div class="quick-actions">
        <a class="quick-card" href="#new-request"><svg class="q-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l4 4v14H7z"/><path d="M12 11v6M9 14h6"/></svg><span>New request</span></a>
        <a class="quick-card q-violet" href="#my-requests"><svg class="q-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v18H7z"/><path d="M10 8h4M10 12h4M10 16h2"/></svg><span>My requests</span></a>
        <a class="quick-card q-cyan" href="../verify.html"><svg class="q-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4.5 6v5.5c0 4.2 3 7.4 7.5 8.5 4.5-1.1 7.5-4.3 7.5-8.5V6L12 3z"/><path d="m9 12 2 2 4-4"/></svg><span>Verify document</span></a>
      </div>
    </section>
    <div id="content" class="stack hidden">
      <section id="stats" class="stats-row" aria-label="Your request statistics"></section>
      <section id="new-request" class="card stack">
        <h2>Request a document</h2>
        <div id="form-alert" class="hidden" role="alert"></div>
        <form id="request-form" class="stack" novalidate>
          <div class="field">
            <label for="documentType">Document type</label>
            <select class="select" id="documentType" name="documentType" required></select>
          </div>
          <div class="field">
            <label for="purpose">Purpose</label>
            <textarea class="input" id="purpose" name="purpose" required minlength="10" maxlength="500" placeholder="Why do you need this document?"></textarea>
            <div class="hint" id="purpose-count">0/500</div>
          </div>
          <button class="btn" id="submit" type="submit">Submit request</button>
        </form>
      </section>
      <section id="my-requests" class="stack">
        <h2>My requests</h2>
        <div id="list-state" class="state"></div>
        <div id="request-list" class="grid"></div>
      </section>
    </div>
  </main>
  <script type="module" src="/js/student.js"></script>
</body>
</html>
