<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>Sign in | DocFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <main id="main" class="center-screen">
    <section class="card card--auth stack">
      <div><span class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="40" height="40"><path d="M12 3 4 6v6c0 4.5 3.2 7.8 8 9 4.8-1.2 8-4.5 8-9V6l-8-3z"/><path d="m9 12 2 2 4-4"/></svg></span></div>
      <div>
        <h1>Sign in</h1>
        <p class="muted">Secure Document Request and Approval Workflow</p>
      </div>
      <div id="form-alert" class="hidden" role="alert"></div>
      <form id="login-form" class="stack" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input class="input" id="email" name="email" type="email" required autocomplete="username" maxlength="254">
          <div class="field-error" id="err-email" role="alert"></div>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input class="input" id="password" name="password" type="password" required autocomplete="current-password" maxlength="72">
          <div class="field-error" id="err-password" role="alert"></div>
        </div>
        <button class="btn btn--block" id="submit" type="submit">Sign in</button>
      </form>
      <form id="mfa-form" class="stack hidden" novalidate>
        <div class="field">
          <label for="code">Authentication code</label>
          <input class="input" id="code" name="code" type="text" inputmode="numeric" required autocomplete="one-time-code" maxlength="11">
          <div class="hint">Enter the 6-digit code from your authenticator app, or one of your backup codes.</div>
        </div>
        <button class="btn btn--block" id="mfa-submit" type="submit">Verify</button>
      </form>
      <p class="muted"><a href="forgot-password.html">Forgot your password?</a></p>
      <p class="muted">New student? <a href="register.html">Create an account</a></p>
    </section>
  </main>
  <footer class="site-footer" role="contentinfo">
    <a href="terms.html">Terms</a> <a href="privacy.html">Privacy</a> <a href="support.html">Support</a> <a href="status.html">Status</a>
  </footer>
  <script type="module" src="/js/login.js"></script>
</body>
</html>
