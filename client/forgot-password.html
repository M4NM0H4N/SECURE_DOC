<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>Forgot password | DocFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <main id="main" class="center-screen">
    <section class="card card--auth stack">
      <div><span class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="40" height="40"><path d="M12 3 4 6v6c0 4.5 3.2 7.8 8 9 4.8-1.2 8-4.5 8-9V6l-8-3z"/><path d="m9 12 2 2 4-4"/></svg></span></div>
      <div>
        <h1>Forgot your password?</h1>
        <p class="muted" id="lead">Enter your e-mail address. If it has an account, we'll send a link to choose a new password.</p>
      </div>
      <div id="form-alert" class="hidden" role="alert"></div>
      <form id="forgot-form" class="stack" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input class="input" id="email" name="email" type="email" required autocomplete="username" maxlength="254">
          <div class="field-error" id="err-email" role="alert"></div>
        </div>
        <button class="btn btn--block" id="submit" type="submit">Send reset link</button>
      </form>
      <p class="muted"><a href="login.html">Back to sign in</a></p>
    </section>
  </main>
  <footer class="site-footer" role="contentinfo">
    <a href="terms.html">Terms</a> <a href="privacy.html">Privacy</a> <a href="support.html">Support</a> <a href="status.html">Status</a>
  </footer>
  <script type="module" src="/js/forgot-password.js"></script>
</body>
</html>
