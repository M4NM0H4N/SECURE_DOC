<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>HOD dashboard | DocFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Sora:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/requests.css">
  <script src="/js/theme.js"></script>
</head>
<body data-role="HOD">
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="topbar"></header>
  <main id="main" class="container page">
    <section class="card welcome-card welcome-card--solo" aria-labelledby="welcome">
      <div>
        <h1 id="welcome">Loading...</h1>
        <p id="hint" class="muted"></p>
      </div>
    </section>
    <div id="content" class="stack hidden">
      <section id="stats" class="stats-row stats-row--auto" aria-label="Queue statistics"></section>
      <div id="page-alert" class="hidden" role="alert"></div>
      <div class="field filter">
        <label for="status-filter">Show</label>
        <select class="select" id="status-filter"></select>
      </div>
      <div id="list-state" class="state"></div>
      <div id="request-list" class="grid"></div>
    </div>
  </main>
  <script type="module" src="/js/staff.js"></script>
</body>
</html>
