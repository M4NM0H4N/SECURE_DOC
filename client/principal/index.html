<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Principal dashboard | DocFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/requests.css">
</head>
<body data-role="PRINCIPAL">
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="topbar"></header>
  <main id="main" class="container page">
    <h1 id="welcome">Loading...</h1>
    <div id="content" class="stack hidden">
      <p id="hint" class="muted"></p>
      <div id="page-alert" class="hidden" role="alert"></div>
      <div class="field filter">
        <label for="status-filter">Show</label>
        <select class="select" id="status-filter"></select>
      </div>
      <div id="list-state" class="state"></div>
      <div id="request-list" class="grid"></div>
    </div>
  </main>
  <script type="module" src="/js/staff.js"></script>
</body>
</html>
