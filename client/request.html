<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Request details | DocFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/requests.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="topbar"></header>
  <main id="main" class="container page stack">
    <a id="back" class="btn btn--ghost btn--sm" href="/">Back</a>
    <section id="detail" class="card stack">
      <div class="state"><div class="spinner"></div><span>Loading request...</span></div>
    </section>
    <section id="documents" class="card stack hidden" aria-labelledby="h-documents">
      <h2 id="h-documents">Documents</h2>
      <p class="muted" id="documents-note"></p>
      <div id="document-list" class="stack"></div>
      <div id="document-tools" class="stack hidden"></div>
    </section>
  </main>
  <script src="/js/vendor/qrcode.js"></script>
  <script type="module" src="/js/request.js"></script>
</body>
</html>
