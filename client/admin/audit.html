<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Audit log | DocFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/requests.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="topbar"></header>
  <main id="main" class="container page stack">
    <div class="req-head">
      <h1>Audit log</h1>
      <a class="btn btn--ghost btn--sm" href="./">Back to users</a>
    </div>
    <p class="muted">Append-only record of important actions, linked by hashes so that changes are detectable. Tamper-evident, not tamper-proof. Read-only.</p>
    <div id="content" class="stack hidden">
      <div class="form-row form-row--2">
        <div class="field filter"><label for="action-filter">Event</label><select class="select" id="action-filter"></select></div>
        <div class="field"><label for="q">Search event name</label><input class="input" id="q" maxlength="80" placeholder="for example login"></div>
      </div>
      <div class="form-row form-row--2">
        <div class="field"><label for="from">From</label><input class="input" id="from" type="date"></div>
        <div class="field"><label for="to">To</label><input class="input" id="to" type="date"></div>
      </div>
      <div class="actions">
        <label class="row"><input type="checkbox" id="oldest"> <span>Oldest first</span></label>
        <a class="btn btn--ghost btn--sm" id="export" href="#">Download CSV</a>
        <button class="btn btn--sm" id="verify" type="button">Verify integrity</button>
      </div>
      <div id="verify-result" class="hidden" role="status"></div>
      <section class="card stack">
        <div id="table-state" class="state"></div>
        <div class="table-wrap">
          <table class="table">
            <caption class="sr-only">Audit events, newest first</caption>
            <thead><tr><th>Time</th><th>Event</th><th>Actor</th><th>#</th><th>Request</th><th>Details</th></tr></thead>
            <tbody id="log-rows"></tbody>
          </table>
        </div>
        <div class="actions">
          <button class="btn btn--ghost btn--sm" id="prev" type="button">Previous</button>
          <button class="btn btn--ghost btn--sm" id="next" type="button">Next</button>
          <span class="muted" id="page-label"></span>
        </div>
      </section>
    </div>
  </main>
  <script type="module" src="/js/audit.js"></script>
</body>
</html>
